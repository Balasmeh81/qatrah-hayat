<div class="forget-password-and-remember-me px-2">
  <app-check-box-input
    [control]="rememberMeControl"
    inputId="rememberMe"
    label="{{ 'Remember_Me' | translate }}"
    name="rememberMe"
    data-aos="fade-down"
    data-aos-delay="400"
  ></app-check-box-input>
  <a
    class="forget-password"
    routerLink="/user-auth/reset-password"
    data-aos="fade-down"
    data-aos-delay="500"
    >{{ "Forget_Password" | translate }}</a
  >
</div>
