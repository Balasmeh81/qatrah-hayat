<div class="auth-page">
  <div class="auth-split-layout auth-split-layout-signup">
    <!-- Visual Side -->
    <div class="auth-visual" data-aos="fade-left" data-aos-delay="100">
      <div class="auth-visual-content">
        <div class="auth-badge">
          <img src="assets/images/signup.svg" alt="Qatrah Hayat Sign Up" />
        </div>

        <h1>{{ "SIGNUP_VISUAL_TITLE" | translate }}</h1>
        <p>
          {{ "SIGNUP_VISUAL_SUBTITLE" | translate }}
        </p>

        <div class="auth-features">
          <div class="feature-item">
            <i class="fa-solid fa-user-plus"></i>
            <span>{{ "SIGNUP_VISUAL_FEATURE_1" | translate }}</span>
          </div>

          <div class="feature-item">
            <i class="fa-solid fa-shield-heart"></i>
            <span>{{ "SIGNUP_VISUAL_FEATURE_2" | translate }}</span>
          </div>

          <div class="feature-item">
            <i class="fa-solid fa-hand-holding-droplet"></i>
            <span>{{ "SIGNUP_VISUAL_FEATURE_3" | translate }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Form Side -->
    <div class="auth-form-side">
      <div
        class="auth-form-wrapper auth-form-wrapper-signup"
        data-aos="fade-up"
        data-aos-delay="150"
      >
        <div class="auth-container">
          <!-- heading -->
          <app-user-auth-container-heading
            title="{{ 'SIGNUP_PAGE_TITLE' | translate }}"
            subtitle="{{ 'SIGNUP_PAGE_SUBTITLE' | translate }}"
          ></app-user-auth-container-heading>

          <!-- form -->
          <app-user-sign-up-form></app-user-sign-up-form>

          <!-- footer -->
          <app-user-auth-container-footer
            text="{{ 'SIGNUP_PAGE_FOOTER_TEXT' | translate }}"
            linkText="{{ 'SIGNUP_PAGE_FOOTER_LINK_TEXT' | translate }}"
            linkUrl="/user-auth/login"
          ></app-user-auth-container-footer>
        </div>
      </div>
    </div>
  </div>
</div>
